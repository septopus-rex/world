<!doctype html>
<meta charset="utf-8">
<title>SPP street</title>
<style>
  html,body{margin:0;background:#05070c;overflow:hidden}
  canvas{display:block}
</style>
<canvas id="c"></canvas>
<script>
/* ============================================================================
 * SPP 展开 — 10s 概念动画
 *
 * 手写的正交软渲染器（canvas 2D），但几何来自 client/core/src/stylepacks 的
 * 真实 option 数据：面 variant 的 parts (u,v,su,sv,w,sw) 按 Expander.partToBox
 * 的同一套映射展开成盒子，材质走 Palette 索引 / 真实贴图。
 * 每帧由帧号完全决定（确定性，无 Date.now / Math.random）。
 * ==========================================================================*/

const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920;
const H = +Q.get('h') || 1080;
const FPS = 60, DUR = 10, TOTAL = FPS * DUR;
const PORTRAIT = H > W;

const cv = document.getElementById('c');
cv.width = W; cv.height = H;
const ctx = cv.getContext('2d', { alpha: false });

/* ---------------------------------------------------------------- palette */
// engine/src/core/utils/Palette.ts —— 索引即语义，颜色照抄
const PALETTE = [
  0x888888,0x555555,0x3d63a8,0xc0392b,0xb9b3a7,0x8f8578,0x9c5a3c,0x6f4b2f,
  0xd8cbb0,0x3b3f46,0xeeeeee,0xc8ccd0,0xb08d57,0x2a2d33,0xdcecf2,0xfaf7f0,
  0x4a7c3f,0x2f5233,0x7a8b3f,0x6b5540,0xc2a878,0x2290cc,0xe8e8ee,0x1d2733,
  0xffcc33,0xff8800,0x33aa55,0x22ccbb,0x7744cc,0xdd4488,0xf5f0e6,0x141418,
];
const rgb = (n) => [(n >> 16) & 255, (n >> 8) & 255, n & 255];

// demo.manifest.json 的贴图条目：id → [文件, 世界尺度(米)]
const TEXDEF = {
  36: ['terran-wall.png', 2], 37: ['terran-roof.png', 2], 38: ['terran-accent.png', 0.5],
  43: ['spanish-wall.png', 2], 44: ['spanish-roof.png', 2], 45: ['spanish-arch.png', 2],
  46: ['brick-wall.png', 2], 47: ['concrete-floor.png', 2],
};
const TEX = {};   // id → {img, pat, size, avg:[r,g,b]}

/* ------------------------------------------------------------------ packs */
const PACK_IDS = ['brick', 'terran', 'ice', 'garden'];
const PACKS = {};

// 语义角色 → 各 pack 的 option key。SPP 里 face 引用的是 key，换 pack 即换皮。
const ROLE = {
  WALL:   { brick:'solid',        terran:'solid',    ice:'ice_wall',      garden:'stone_wall'    },
  DOOR:   { brick:'doorway',      terran:'doorway',  ice:'ice_gate',      garden:'arbor_gate'    },
  WINDOW: { brick:'arch_window',  terran:'window',   ice:'ice_window',    garden:'window_lattice'},
  WIN2:   { brick:'window',       terran:'window',   ice:'ice_window',    garden:'lattice'       },
  PLINTH: { brick:'plinth',       terran:'deck',     ice:'snow_bank',     garden:'flower_wall'   },
  PILLAR: { brick:'pilaster',     terran:'pipe_wall',ice:'ice_pillar',    garden:'hedge_flower'  },
  QUOIN:  { brick:'quoin',        terran:'corner',   ice:'glacier',       garden:'lattice'       },
  BLIND:  { brick:'blind_arcade', terran:'vent',     ice:'frost_wall',    garden:'hedge'         },
  FLOOR:  { brick:'floor',        terran:'floor',    ice:'frozen_floor',  garden:'deck'          },
  ROOF:   { brick:'roof_slate',   terran:'roof',     ice:'rime_roof',     garden:'pergola_roof'  },
  EAVES:  { brick:'corbel_eaves', terran:'parapet',  ice:'icicles',       garden:'planter'       },
  PARAPET:{ brick:'parapet',      terran:'parapet',  ice:'snow_bank',     garden:'hedge'         },
  CHIMNEY:{ brick:'chimney_stack',terran:'vent',     ice:'ice_pillar',    garden:'planter'       },
  DECK:   { brick:'gutter',       terran:'deck',     ice:'ice_deck',      garden:'stone_path'    },
  // open 池
  EMPTY:  { brick:'empty',        terran:'empty',    ice:'empty',         garden:'empty'         },
  ARCADE: { brick:'arcade',       terran:'gate',     ice:'ice_arch',      garden:'arch'          },
  RAIL:   { brick:'railing',      terran:'railing',  ice:'ice_rail',      garden:'colonnade'     },
  GATE:   { brick:'gate_iron',    terran:'gate',     ice:'crack_gap',     garden:'hedge_gap'     },
};
const OPEN_ROLES = new Set(['EMPTY', 'ARCADE', 'RAIL', 'GATE']);

function variantOf(packId, role) {
  const pack = PACKS[packId]; if (!pack) return null;
  const pool = OPEN_ROLES.has(role) ? pack.open : pack.closed;
  const key = (ROLE[role] || {})[packId];
  return pool.find(v => (v.key ?? v.name) === key) || pool[0] || null;
}

/* -------------------------------------------------------------- expansion */
// 面索引 = ParticleFace: 0 Top(Z+) 1 Bottom(Z-) 2 Front(Y-) 3 Back(Y+) 4 Left(X-) 5 Right(X+)
// Expander.partToBox 的同一套映射（u/v = 面内两轴, w = 由面向内的深度）
function partToBox(face, part, s, thickness) {
  const uC = (part.u + part.su / 2) * s, sum = part.su * s;
  const vC = (part.v + part.sv / 2) * s, svm = part.sv * s;
  const swm = part.sw != null ? part.sw * s : thickness * s / 4;
  const wC = (part.w ?? 0) * s + swm / 2;
  switch (face) {
    case 4: return { size: [swm, sum, svm], center: [wC, uC, vC] };          // Left  X-
    case 5: return { size: [swm, sum, svm], center: [s - wC, uC, vC] };      // Right X+
    case 2: return { size: [sum, swm, svm], center: [uC, wC, vC] };          // Front Y-
    case 3: return { size: [sum, swm, svm], center: [uC, s - wC, vC] };      // Back  Y+
    case 1: return { size: [sum, svm, swm], center: [uC, vC, wC] };          // Bottom Z-
    case 0: return { size: [sum, svm, swm], center: [uC, vC, s - wC] };      // Top   Z+
  }
}

// 一个面 → 该面所有 part 的世界盒子
function faceBoxes(packId, role, face, origin, s, out) {
  const v = variantOf(packId, role); if (!v) return;
  const pack = PACKS[packId];
  const parts = v.parts || (v.pieces || []).map(p => ({
    type: 0xa2, u: p.du, v: p.dv, su: p.su, sv: p.sv, props: [0, [1, 1], 0, 1],
  }));
  for (const part of parts) {
    const b = partToBox(face, part, s, pack.thickness ?? 0.1);
    const pr = part.props || [];
    out.push({
      type: part.type ?? 0xa2,
      size: b.size,
      pos: [origin[0] + b.center[0], origin[1] + b.center[1], origin[2] + b.center[2]],
      slot3: typeof pr[0] === 'number' ? pr[0] : 0,
      tex: typeof pr[4] === 'number' ? pr[4] : null,
    });
  }
}

// 整个面的薄板（叠加态的"面板"底色用）
function panelBox(face, origin, s) {
  const b = partToBox(face, { u: 0, v: 0, su: 1, sv: 1, w: 0, sw: 0.006 }, s, 0.1);
  return [{ type: 0xa2, size: b.size, pos: [origin[0]+b.center[0], origin[1]+b.center[1], origin[2]+b.center[2]], slot3: 0, tex: null }];
}

// 一个 cell（6 面各一个 role）→ 盒子。skipFaces 用于同层邻接消除。
function cellBoxes(packId, roles, origin, s, out, skip) {
  for (let f = 0; f < 6; f++) {
    if (skip && skip.has(f)) continue;
    const r = roles[f]; if (!r || r === 'SKIP') continue;
    faceBoxes(packId, r, f, origin, s, out);
  }
}

/* ------------------------------------------------------------------- math */
const V = {
  sub: (a, b) => [a[0]-b[0], a[1]-b[1], a[2]-b[2]],
  dot: (a, b) => a[0]*b[0] + a[1]*b[1] + a[2]*b[2],
  norm: (a) => { const l = Math.hypot(a[0],a[1],a[2]) || 1; return [a[0]/l, a[1]/l, a[2]/l]; },
};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeInOut = (t) => { t = clamp(t, 0, 1); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; };
// mulberry32 —— 与引擎坍缩同款，保证确定性
function rng(seed) {
  let a = seed >>> 0;
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

/* ----------------------------------------------------------------- camera */
function camera(yaw, pitch, scale, target, shiftY) {
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  const dir = [cp * cy, cp * sy, sp];        // 目标 → 相机
  const right = [-sy, cy, 0];
  const up = [-sp * cy, -sp * sy, cp];
  const ox = W / 2, oy = H / 2 + (shiftY || 0);
  return {
    dir, right, up, scale,
    project(p) {
      const d = V.sub(p, target);
      return { x: ox + V.dot(d, right) * scale, y: oy - V.dot(d, up) * scale, z: V.dot(d, dir) };
    },
  };
}

const LIGHT = V.norm([-0.42, -0.78, 0.72]);   // 世界光向（指向光源）

/* --------------------------------------------------------------- renderer */
const BOXFACES = [           // [轴, 符号, 面内 u 轴, 面内 v 轴]
  [0, +1, 1, 2], [0, -1, 1, 2],
  [1, +1, 0, 2], [1, -1, 0, 2],
  [2, +1, 0, 1], [2, -1, 0, 1],
];

// 收集一批盒子的可见面 → 屏幕多边形 + 材质，按深度排序后统一画
function collect(boxes, cam, opt) {
  const out = [];
  for (const b of boxes) {
    const [sx, sy, sz] = b.size, c = b.pos;
    const hx = sx / 2, hy = sy / 2, hz = sz / 2;
    if (b.type === 0xa7) {   // a7 球：正交投影下是个圆
      const p = cam.project(c);
      out.push({ kind: 'ball', p, r: Math.max(sx, sy, sz) / 2 * cam.scale, z: p.z, box: b });
      continue;
    }
    const h = [hx, hy, hz];
    for (const [ax, sgn, ua, va] of BOXFACES) {
      const n = [0, 0, 0]; n[ax] = sgn;
      const ndl = V.dot(n, cam.dir);
      if (ndl <= 0.002) continue;                       // 背面剔除
      const base = [c[0], c[1], c[2]]; base[ax] += sgn * h[ax];
      const U = [0, 0, 0]; U[ua] = h[ua] * 2;
      const Vv = [0, 0, 0]; Vv[va] = h[va] * 2;
      const p0 = [base[0] - U[0]/2 - Vv[0]/2, base[1] - U[1]/2 - Vv[1]/2, base[2] - U[2]/2 - Vv[2]/2];
      const q0 = cam.project(p0);
      const q1 = cam.project([p0[0]+U[0], p0[1]+U[1], p0[2]+U[2]]);
      const q2 = cam.project([p0[0]+U[0]+Vv[0], p0[1]+U[1]+Vv[1], p0[2]+U[2]+Vv[2]]);
      const q3 = cam.project([p0[0]+Vv[0], p0[1]+Vv[1], p0[2]+Vv[2]]);
      out.push({
        kind: 'face', q: [q0, q1, q2, q3], n,
        lum: 0.30 + 0.70 * Math.max(0, V.dot(n, LIGHT)),
        z: (q0.z + q1.z + q2.z + q3.z) / 4,
        lu: Math.hypot(U[0], U[1], U[2]), lv: Math.hypot(Vv[0], Vv[1], Vv[2]),
        box: b,
      });
    }
  }
  out.sort((a, b) => a.z - b.z);
  return out;
}

function baseColor(box) {
  if (box.slot3 > 255) return rgb(box.slot3);
  if (box.slot3 >= 1 && box.slot3 < 32) return rgb(PALETTE[box.slot3]);
  if (box.tex != null && TEX[box.tex]) return TEX[box.tex].avg;
  return rgb(PALETTE[0]);
}

function paint(items, opt) {
  opt = opt || {};
  const gAlpha = opt.alpha == null ? 1 : opt.alpha;
  for (const it of items) {
    if (it.kind === 'ball') {
      const col = baseColor(it.box);
      ctx.globalAlpha = gAlpha;
      const g = ctx.createRadialGradient(it.p.x - it.r*0.35, it.p.y - it.r*0.4, it.r*0.1, it.p.x, it.p.y, it.r);
      g.addColorStop(0, `rgb(${Math.min(255,col[0]*1.35|0)},${Math.min(255,col[1]*1.35|0)},${Math.min(255,col[2]*1.35|0)})`);
      g.addColorStop(1, `rgb(${col[0]*0.55|0},${col[1]*0.55|0},${col[2]*0.55|0})`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(it.p.x, it.p.y, Math.max(0.6, it.r), 0, 6.2832); ctx.fill();
      continue;
    }
    const [q0, q1, q2, q3] = it.q;
    ctx.globalAlpha = gAlpha;
    ctx.beginPath();
    ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.closePath();

    const t = it.box.tex != null ? TEX[it.box.tex] : null;
    const col = baseColor(it.box);
    if (t && it.lu > 0.02 && it.lv > 0.02 && opt.textures !== false) {
      const nu = Math.max(0.08, it.lu / t.size), nv = Math.max(0.08, it.lv / t.size);
      const ux = (q1.x - q0.x), uy = (q1.y - q0.y), vx = (q3.x - q0.x), vy = (q3.y - q0.y);
      ctx.save(); ctx.clip();
      ctx.transform(ux / (nu * t.img.width), uy / (nu * t.img.width),
                    vx / (nv * t.img.height), vy / (nv * t.img.height), q0.x, q0.y);
      ctx.fillStyle = t.pat;
      ctx.fillRect(0, 0, nu * t.img.width, nv * t.img.height);
      ctx.restore();
      // 明暗：贴图之上叠一层
      const s = it.lum;
      ctx.fillStyle = s < 0.62 ? `rgba(4,7,14,${clamp((0.62 - s) * 1.5, 0, .82)})`
                               : `rgba(255,246,226,${clamp((s - 0.62) * 0.55, 0, .3)})`;
      ctx.fill();
    } else {
      const s = it.lum;
      ctx.fillStyle = `rgb(${clamp(col[0]*s,0,255)|0},${clamp(col[1]*s,0,255)|0},${clamp(col[2]*s,0,255)|0})`;
      ctx.fill();
    }
    if (opt.edge !== false && it.lu * cam0scale > 9 && it.lv * cam0scale > 9) {
      ctx.strokeStyle = `rgba(8,11,18,${0.20 * gAlpha})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}
let cam0scale = 30;   // paint 里判断描边阈值用（由 renderFrame 设置）

/* 线框 / 幽灵态：只画边，发光 */
function ghost(boxes, cam, color, alpha, lw) {
  const items = collect(boxes, cam, {});
  ctx.lineJoin = 'round';
  for (const pass of [[(lw||1.6) * 3.2, alpha * 0.16], [(lw||1.6), alpha * 0.95]]) {
    ctx.lineWidth = pass[0]; ctx.strokeStyle = `rgba(${color},${pass[1]})`;
    ctx.beginPath();
    for (const it of items) {
      if (it.kind !== 'face') continue;
      const [q0, q1, q2, q3] = it.q;
      ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.closePath();
    }
    ctx.stroke();
  }
}
function ghostFill(boxes, cam, color, alpha) {
  const items = collect(boxes, cam, {});
  ctx.fillStyle = `rgba(${color},${alpha})`;
  ctx.beginPath();
  for (const it of items) {
    if (it.kind !== 'face') continue;
    const [q0, q1, q2, q3] = it.q;
    ctx.moveTo(q0.x, q0.y); ctx.lineTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.closePath();
  }
  ctx.fill();
}

/* -------------------------------------------------------- cell 线框 / 网格 */
function cellWire(cam, origin, s, grow, alpha, color) {
  const o = origin, e = s * grow, c = [o[0] + s/2, o[1] + s/2, o[2] + s/2];
  const P = (a, b, cc) => cam.project([c[0] + (a - .5) * e, c[1] + (b - .5) * e, c[2] + (cc - .5) * e]);
  const v = [P(0,0,0),P(1,0,0),P(1,1,0),P(0,1,0),P(0,0,1),P(1,0,1),P(1,1,1),P(0,1,1)];
  const E = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  for (const pass of [[5.5, alpha * 0.13], [1.7, alpha]]) {
    ctx.lineWidth = pass[0]; ctx.strokeStyle = `rgba(${color || '104,214,255'},${pass[1]})`;
    ctx.beginPath();
    for (const [a, b] of E) { ctx.moveTo(v[a].x, v[a].y); ctx.lineTo(v[b].x, v[b].y); }
    ctx.stroke();
  }
  // 顶点点子
  ctx.fillStyle = `rgba(180,240,255,${alpha})`;
  for (const p of v) { ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.2832); ctx.fill(); }
}

function groundGrid(cam, alpha, span, step, z) {
  if (alpha <= 0.005) return;
  ctx.lineWidth = 1;
  for (let i = -span; i <= span; i += step) {
    for (const [a, b] of [[[i, -span, z], [i, span, z]], [[-span, i, z], [span, i, z]]]) {
      const p = cam.project(a), q = cam.project(b);
      const g = ctx.createLinearGradient(p.x, p.y, q.x, q.y);
      const fade = Math.max(0, 1 - Math.abs(i) / span);
      g.addColorStop(0, `rgba(78,150,190,0)`);
      g.addColorStop(.5, `rgba(78,150,190,${alpha * (0.16 + 0.5 * fade)})`);
      g.addColorStop(1, `rgba(78,150,190,0)`);
      ctx.strokeStyle = g;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    }
  }
}

/* -------------------------------------------------------------- 背景 / 光 */
function background(f) {
  const g = ctx.createRadialGradient(W * 0.5, H * 0.46, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.72);
  g.addColorStop(0, '#0d1622');
  g.addColorStop(0.55, '#070b13');
  g.addColorStop(1, '#04060a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// 地面接触阴影 —— 没有它，什么都像悬在空中
function contactShadow(cam, x0, x1, y0, y1, alpha, blurPx) {
  if (alpha <= 0.01) return;
  const c = [[x0, y0], [x1, y0], [x1, y1], [x0, y1]].map(p => cam.project([p[0], p[1], 0.03]));
  ctx.save();
  ctx.filter = `blur(${blurPx}px)`;
  ctx.fillStyle = `rgba(0,0,0,${alpha})`;
  ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y);
  for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

const STARS = (() => {
  const r = rng(20260812), a = [];
  for (let i = 0; i < 150; i++) a.push([r(), r(), 0.25 + r() * 0.75, r() * 6.28]);
  return a;
})();
function starfield(f) {
  for (const [u, v, b, ph] of STARS) {
    const tw = 0.55 + 0.45 * Math.sin(f * 0.035 + ph);
    ctx.fillStyle = `rgba(150,200,235,${0.05 + 0.16 * b * tw})`;
    ctx.fillRect(u * W, v * H, 1.4, 1.4);
  }
}

function glow(x, y, r, color, a) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${color},${a})`);
  g.addColorStop(0.4, `rgba(${color},${a * 0.35})`);
  g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}

// 坍缩扫描面：贴着胞的水平光框（不是横穿画面的大平面）
function sweepPlane(cam, zWorld, box, alpha, color) {
  if (alpha <= 0.01) return;
  const [x0, x1, y0, y1] = box, m = 0.55;
  const c = [[x0-m, y0-m], [x1+m, y0-m], [x1+m, y1+m], [x0-m, y1+m]].map(p => cam.project([p[0], p[1], zWorld]));
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y); ctx.closePath();
  ctx.fillStyle = `rgba(${color},${alpha * 0.09})`; ctx.fill();
  ctx.lineWidth = 9; ctx.strokeStyle = `rgba(${color},${alpha * 0.13})`; ctx.stroke();
  ctx.lineWidth = 2.2; ctx.strokeStyle = `rgba(${color},${alpha * 0.9})`; ctx.stroke();
  ctx.restore();
}

// 把一批盒子按波面 z 裁掉上半——坍缩是长出来的，不是整块蹦出来的
function clipToWave(all, z, out) {
  for (const b of all) {
    const zb = b.pos[2] - b.size[2] / 2, zt = b.pos[2] + b.size[2] / 2;
    if (zb >= z) continue;
    if (zt <= z) { out.push(b); continue; }
    const h = z - zb;
    if (h < 0.012) continue;
    out.push({ ...b, size: [b.size[0], b.size[1], h], pos: [b.pos[0], b.pos[1], zb + h / 2] });
  }
}

/* ===========================================================================
 *  内容：一条街 —— 若干栋楼沿 +X 联排，进深 2 格，高度/立面语汇各不同
 * ========================================================================= */
const S = 4;   // cellSize(level 0) = 4m

// 叠加态候选池（开场那一拍用）
const CANDIDATES = [
  ['ROOF', 'PARAPET', 'EAVES', 'DECK'],
  ['FLOOR', 'PLINTH', 'DECK', 'WALL'],
  ['DOOR', 'WINDOW', 'WALL', 'ARCADE'],
  ['WALL', 'WIN2', 'BLIND', 'PILLAR'],
  ['WINDOW', 'WALL', 'QUOIN', 'PILLAR'],
  ['WALL', 'WIN2', 'PILLAR', 'BLIND'],
];

// 三种沿街立面语汇：住宅 / 塔楼 / 带拱廊的商铺（后者底层走 open 池，
// 于是街上真有一段是通透的——open/closed 两池同时在画面里）
const KIND = [
  { front: (z, mid) => z === 0 ? (mid ? 'DOOR' : 'PLINTH') : z === 1 ? 'WINDOW' : 'WIN2',
    side: (z) => z === 0 ? 'PLINTH' : 'WINDOW', top: 'ROOF', back: (z) => z === 0 ? 'PLINTH' : 'WIN2' },
  { front: (z) => z === 0 ? 'PLINTH' : z === 1 ? 'WIN2' : 'WINDOW',
    side: (z) => z === 0 ? 'PLINTH' : 'PILLAR', top: 'PARAPET', back: () => 'BLIND' },
  { front: (z, mid) => z === 0 ? 'ARCADE' : (mid ? 'WINDOW' : 'WIN2'),
    side: (z) => z === 0 ? 'ARCADE' : 'QUOIN', top: 'EAVES', back: (z) => z === 0 ? 'BLIND' : 'WIN2' },
];

const STREET = (() => {
  // y0 = 这栋楼退线几格 —— 立面不在一个平面上，才有街道的凹凸与侧墙
  const PLAN = [
    { w: 3, h: 3, k: 0, y0: 0 }, { w: 2, h: 4, k: 1, y0: 1 }, { gap: 1 },
    { w: 3, h: 2, k: 2, y0: 0 }, { w: 2, h: 5, k: 1, y0: 0 }, { w: 3, h: 4, k: 0, y0: 1 },
    { gap: 1 }, { w: 2, h: 3, k: 2, y0: 0 },
  ];
  const NY = 2, occ = new Set(), lots = [];
  let x = 0;
  for (const p of PLAN) {
    if (p.gap) { x += p.gap; continue; }
    lots.push({ x0: x, ...p });
    for (let i = 0; i < p.w; i++) for (let y = 0; y < NY; y++) for (let z = 0; z < p.h; z++)
      occ.add(`${x+i},${y + p.y0},${z}`);
    x += p.w;
  }
  const NX = x;
  const has = (a, b, c) => occ.has(`${a},${b},${c}`);
  const cells = [];
  for (const lot of lots) {
    const K = KIND[lot.k], mid = lot.x0 + (lot.w >> 1);
    for (let i = 0; i < lot.w; i++) for (let yy = 0; yy < NY; yy++) for (let z = 0; z < lot.h; z++) {
      const gx = lot.x0 + i, y = yy + lot.y0;
      const roles = new Array(6).fill('SKIP');
      // 面只在外表面出几何 —— 联排的相邻墙自动消掉（引擎的同层邻接消除）
      if (!has(gx, y, z + 1)) roles[0] = (K.top === 'ROOF' && gx % 3 === 1 && z >= 2) ? 'CHIMNEY' : K.top;
      if (!has(gx, y, z - 1)) roles[1] = 'PLINTH';
      if (!has(gx, y - 1, z)) roles[2] = K.front(z, gx === mid);
      if (!has(gx, y + 1, z)) roles[3] = K.back(z);
      if (!has(gx - 1, y, z)) roles[4] = K.side(z);
      if (!has(gx + 1, y, z)) roles[5] = K.side(z);
      cells.push({ g: [gx, y, z], roles, lot: lots.indexOf(lot) });
    }
  }
  for (let gx = -1; gx <= NX; gx++) {
    const roles = new Array(6).fill('SKIP');
    roles[0] = 'DECK';
    cells.push({ g: [gx, -1, -1], roles, lot: 0, road: true });
  }
  return { cells, lots, NX, NY };
})();
const SPAN_X = STREET.NX * S;                       // 街全长（米）

// 按某个轴把盒子切开：坍缩/换皮的波前才是"长出来的"而不是整块蹦出来的
function clipAxis(all, axis, v, out) {
  for (const b of all) {
    const lo = b.pos[axis] - b.size[axis] / 2, hi = b.pos[axis] + b.size[axis] / 2;
    if (lo >= v) continue;
    if (hi <= v) { out.push(b); continue; }
    const len = v - lo;
    if (len < 0.012) continue;
    const size = b.size.slice(), pos = b.pos.slice();
    size[axis] = len; pos[axis] = lo + len / 2;
    out.push({ ...b, size, pos });
  }
}

/* ===========================================================================
 *  分镜 —— 60fps × 10s = 600 帧
 *  线框铺开 → 坍缩波横扫成砖街 → 三次换皮（terran / ice / garden）
 * ========================================================================= */
const P1 = 0, P2 = 64, P3 = 206, P4 = 337, P5 = 468, END = TOTAL;
const SKIN = [P3, P4, P5];                          // 三次换皮各自的起点

function camFor(f) {
  const yaw = -1.86 + f / TOTAL * 0.42;             // 始终大致正对街立面
  const pitch = 0.30 - 0.06 * smooth(f / TOTAL);
  // 横版装得下整条街；竖版装不下（72 m 的街塞进 9:16 只会两端出画），
  // 所以竖版改成跟着波前走 —— 看的是"街的一段被换掉"，不是全景。
  const u = PORTRAIT ? Math.min(W, H) * 0.0300 : Math.min(W, H) * 0.0226;
  const scale = u * (1 + 0.045 * smooth((f - P2) / 200));   // 极缓慢推近
  let tx;
  if (PORTRAIT) {
    const st = styleAt(f);
    const front = st.i >= 0 ? skinX(f, st.i) : collapseX(f);
    tx = clamp(front, SPAN_X * 0.20, SPAN_X * 0.80);
  } else {
    tx = lerp(SPAN_X * 0.42, SPAN_X * 0.58, smooth(f / TOTAL));   // 轻微跟随感
  }
  const target = [tx, S * 0.7, S * 1.55];
  return camera(yaw, pitch, scale, target, PORTRAIT ? H * 0.07 : H * 0.022);
}

// 坍缩波：沿 +X 横扫整条街
const collapseX = (f) => lerp(-2, SPAN_X + 2, easeInOut((f - P2) / (P3 - P2 - 16)));
// 第 i 次换皮的波位置
const skinX = (f, i) => lerp(-2, SPAN_X + 2, easeInOut((f - SKIN[i]) / 108));

function styleAt(f) {
  if (f < P3) return { a: 'brick', b: 'brick', i: -1 };
  const i = f >= P5 ? 2 : f >= P4 ? 1 : 0;
  return { a: PACK_IDS[i], b: PACK_IDS[i + 1], i };
}

function renderFrame(f) {
  f = clamp(f, 0, END - 1);
  const cam = camFor(f);
  cam0scale = cam.scale;
  background(f);
  starfield(f);
  groundGrid(cam, 0.5 * smooth((f - 8) / 34), 62, 4, 0);

  const st = styleAt(f);
  const cx = collapseX(f);
  const sx = st.i >= 0 ? skinX(f, st.i) : -99;

  // 接触阴影跟着坍缩波长出来
  if (f >= P2) for (const lot of STREET.lots) {
    const x0 = lot.x0 * S; if (x0 > cx) continue;
    contactShadow(cam, x0 - 0.5, Math.min((lot.x0 + lot.w) * S + 0.5, cx),
                  lot.y0 * S - 0.5, (lot.y0 + STREET.NY) * S + 0.5, 0.30, 32);
  }

  /* ---------------------------------------------- 未坍缩的部分：线框叠加态 */
  const r = rng(Math.floor(f / 5) * 977 + 13);
  for (const c of STREET.cells) {
    if (c.road) continue;
    const o = [c.g[0] * S, c.g[1] * S, c.g[2] * S];
    if (o[0] < cx - S) continue;                     // 已经实体化
    const appear = clamp((f - P1 - c.lot * 5 - c.g[2] * 2) / 18, 0, 1);
    if (appear <= 0) continue;
    cellWire(cam, o, S, 1, appear * 0.5);
    // 每格随机一面在候选之间跳 —— 整条街都在"未定"状态
    const face = 2 + Math.floor(r() * 4);
    if (c.roles[face] !== 'SKIP' && r() > 0.45) {
      const bx = []; faceBoxes('brick', CANDIDATES[face][Math.floor(r() * 4)], face, o, S, bx);
      ghost(bx, cam, '150,238,255', appear * 0.65, 1.2);
    }
  }

  /* ------------------------------------------------------------ 实体：街本身 */
  const solid = [];
  for (const c of STREET.cells) {
    const o = [c.g[0] * S, c.g[1] * S, c.g[2] * S];
    if (o[0] >= cx) continue;
    // 换皮波扫过的部分用新 pack —— 几何跟着换，不只是换色
    const pid = (o[0] + S / 2 < sx) ? st.b : st.a;
    const all = [];
    for (let face = 0; face < 6; face++) {
      if (c.roles[face] === 'SKIP') continue;
      faceBoxes(pid, c.roles[face], face, o, S, all);
    }
    clipAxis(all, 0, cx, solid);                     // 坍缩波前把楼切开
  }
  if (solid.length) paint(collect(solid, cam, {}), { textures: true });

  /* ------------------------------------------------------------ 两道波的光墙 */
  const wall = (x, a, w) => {
    if (a <= 0.01 || x < -3 || x > SPAN_X + 3) return;
    const c = [[-5.2, -0.6], [S * STREET.NY + 2.2, -0.6], [S * STREET.NY + 2.2, S * 5.3], [-5.2, S * 5.3]]
      .map(p => cam.project([x, p[0], p[1]]));
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    ctx.beginPath(); ctx.moveTo(c[0].x, c[0].y); for (let i = 1; i < 4; i++) ctx.lineTo(c[i].x, c[i].y); ctx.closePath();
    ctx.fillStyle = `rgba(150,230,255,${0.05 * a})`; ctx.fill();
    ctx.lineWidth = w * 8; ctx.strokeStyle = `rgba(150,230,255,${0.09 * a})`; ctx.stroke();
    ctx.lineWidth = w * 1.6; ctx.strokeStyle = `rgba(210,246,255,${0.8 * a})`; ctx.stroke();
    ctx.restore();
  };
  wall(cx, 1 - smooth((f - P3 + 26) / 26), 1.5);
  if (st.i >= 0) wall(sx, 1 - smooth((f - SKIN[st.i] - 104) / 18), 1.2);

  vignette();
}

function vignette() {
  const g = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.30, W/2, H/2, Math.max(W,H) * 0.78);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.42)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

/* ------------------------------------------------------------------- boot */
function loadImg(src) {
  return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
}
async function boot() {
  for (const id of PACK_IDS) PACKS[id] = await (await fetch(`/client/core/src/stylepacks/${id}.stylepack.json`)).json();
  for (const [id, [file, size]] of Object.entries(TEXDEF)) {
    const img = await loadImg('/client/desktop/public/assets/' + file);
    const oc = document.createElement('canvas'); oc.width = img.width; oc.height = img.height;
    const octx = oc.getContext('2d'); octx.drawImage(img, 0, 0);
    const d = octx.getImageData(0, 0, oc.width, oc.height).data;
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; }
    const n = d.length / 4;
    TEX[id] = { img, pat: ctx.createPattern(img, 'repeat'), size, avg: [r/n|0, g/n|0, b/n|0] };
  }
  window.TOTAL = TOTAL;
  window.renderFrame = renderFrame;   // 直接引用，别包箭头（会解析回 window.renderFrame 递归）
  window.READY = true;
  renderFrame(+Q.get('f') || 0);
  if (Q.get('play')) {
    let f = 0;
    setInterval(() => { renderFrame(f); f = (f + 1) % TOTAL; }, 1000 / FPS);
  }
}
boot();
</script>
